spring.application.name=three-tier-demo
server.port=8080
server.shutdown=graceful

# Defaults are for local development only. In AWS the ECS task sets
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD, which override these.
spring.datasource.url=jdbc:mysql://localhost:3306/appdb
spring.datasource.username=root
spring.datasource.password=

# Dev convenience: create/update tables automatically.
# For real production, replace with Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# /actuator/health also checks the database connection.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
